<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento | PetShop</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Estilos globais e componentes -->
  <link rel="stylesheet" href="./src/styles/global.css">
  <link rel="stylesheet" href="./src/styles/header.css">
  <link rel="stylesheet" href="./src/styles/schedule.css">
  <link rel="stylesheet" href="./src/styles/modal.css">
</head>
<body>
  
  <header>
    <div class="logo">
      <img src="./src/assets/dog.svg" alt="Ícone Pet">
      <img src="./src/assets/vetor.svg" alt="Mundo Pet">
    </div>
  </header>

  <main class="container">
    <!-- Main Header com a Data -->
    <header class="main-header">
      <div class="title-wrapper">
        <h1>Sua agenda</h1>
        <p>Aqui você pode ver todos os clientes e serviços agendados para hoje.</p>
      </div>
      <div class="date-selector">
        <img src="./src/assets/calendar.svg" alt="Calendário">
        <input type="date" id="schedule-date" />
        <img src="./src/assets/icon.svg" alt="Selecionar data" class="dropdown-icon">
      </div>
    </header>

    <section id="morning" class="schedule-period">
      <h2>
        <img src="./src/assets/sun-fog.svg" alt="Manhã">
        Manhã <span>09h-12h</span>
      </h2>
      <ul class="schedule-list">
        <!-- Card Estático Fiel ao Figma -->
        <li class="schedule-item">
          <span class="time">09:00</span>
          <div class="client-info">
            <strong>Thor</strong>
            <span>/ Fernanda Costa</span>
          </div>
          <span class="service">Vacinação</span>
          <button class="btn-remove">Remover agendamento</button>
        </li>
      </ul>
    </section>

    <section id="afternoon" class="schedule-period">
      <h2>
        <img src="./src/assets/cloud-sun.svg" alt="Tarde">
        Tarde <span>13h-18h</span>
      </h2>
      <ul class="schedule-list">
        <!-- JS injetará cards aqui -->
      </ul>
    </section>

    <section id="evening" class="schedule-period">
      <h2>
        <img src="./src/assets/moon-stars.svg" alt="Noite">
        Noite <span>19h-21h</span>
      </h2>
      <ul class="schedule-list">
        <!-- JS injetará cards aqui -->
      </ul>
    </section>
  </main>

  <!-- Botão Flutuante (Fixo no canto direito) -->
  <button id="btn-new-schedule">NOVO AGENDAMENTO</button>

  <!-- MODAL DE NOVO AGENDAMENTO -->
  <div id="modal-new-schedule" class="modal-overlay hidden">
    <div class="modal-content">
      <header>
        <div>
          <h2>Agende um atendimento</h2>
          <p class="subtitle">Preencha os dados do cliente para realizar o agendamento:</p>
        </div>
        <button class="btn-close-modal">
          <img src="./src/assets/closex.svg" alt="Fechar">
        </button>
      </header>
      
      <form id="new-schedule-form">
        <div class="input-group">
          <label for="tutor">Nome do tutor</label>
          <div class="input-wrapper">
            <img src="./src/assets/user.svg" alt="Ícone Tutor">
            <input type="text" id="tutor" required>
          </div>
        </div>

        <div class="input-group">
          <label for="pet">Nome do pet</label>
          <div class="input-wrapper">
            <img src="./src/assets/pet-paw.svg" alt="Ícone Pet">
            <input type="text" id="pet" required>
          </div>
        </div>

        <div class="input-group">
          <label for="phone">Telefone</label>
          <div class="input-wrapper">
            <img src="./src/assets/phone.svg" alt="Ícone Telefone">
            <input type="tel" id="phone" placeholder="(00) 0 0000-0000" required>
          </div>
        </div>

        <div class="input-group">
          <label for="service">Descrição do serviço</label>
          <textarea id="service" placeholder="Banho e tosa" rows="3" required></textarea>
        </div>

        <div class="input-row">
          <div class="input-group">
            <label for="date">Data</label>
            <div class="input-wrapper">
              <img src="./src/assets/calendar.svg" alt="Ícone Data">
              <input type="date" id="date" required>
            </div>
          </div>
          <div class="input-group">
            <label>Selecione horário</label>
            <ul id="hours" class="hours-list">

            </ul>
          </div>
        </div>

        <button type="submit" class="btn-submit">AGENDAR</button>
      </form>
    </div>
  </div>

</body>
</html>
